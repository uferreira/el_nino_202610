[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "enso"
version = "0.1.0"
description = "El Niño phase space: data pipeline and static site generator"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "requests",
    "pyyaml",
    "plotly>=6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
test = ["pytest", "playwright"]
scripts = ["matplotlib"]   # scripts/lyapunov_sweep.py, scripts/weekly_vs_monthly.py

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enso = ["site/templates/*.html", "site/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs Playwright and Chromium"]
