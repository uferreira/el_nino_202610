# el_nino_202610 configuration.
#
# Everything the site shows is decided here and computed in Python.
# The browser only draws what `python -m enso.build` writes to docs/.

# Fourier low-pass filter (same parameters as the reference Fortran).
filter:
  HN1: 10.0   # half-period parameter: 20-month full-period pass edge
  HN2: 9.0    # half-period parameter: 18-month full-period stop edge
  NDOTS: 5    # interpolated points per month on the phase loop
  # Analysis window, inclusive "YYYY-MM". null end = latest observation;
  # null start = base_year, in the month after the end month, so the window
  # spans whole 12-month cycles (enso.window.resolve_fourier_window).
  window:
    start: null
    end: null
    base_year: 1975
  # The last months of a filtered record change as new months arrive (the
  # filter pins its end to the latest observation). Shown as provisional.
  # Why 10: see METHODS.md, "Provisional end".
  provisional_months: 10

# Variable groups: one per kind of quantity. A group sets the unit and the
# heading of its block in the dataset selector.
groups:
  sst:
    label: Sea surface temperature
    unit: "°C"
  sea_level:
    label: Sea level
    unit: mm

# Datasets, in selector order. To add one, add an entry here and, if its
# source type is new, a fetcher in enso/fetch.py (SOURCES).
#
#   quantity: what the phase diagram's T axis shows
#     absolute     filtered value with its seasonal cycle (NINO1+2 SST, °C)
#     anomaly      the source already removed the seasonal cycle (NOAA anomalies)
#     record_mean  filtered value with seasonal cycle, minus the window mean
#   cadence: monthly (a weekly series would set "weekly" here)
datasets:
  - key: nino12
    label: NINO1+2
    long_label: NINO1+2 SST (0 to 10°S, 90 to 80°W)
    group: sst
    quantity: absolute
    cadence: monthly
    source: {type: noaa_sst, column: SST0}
  - key: nino3
    label: NINO3 anomaly
    long_label: NINO3 SST anomaly (5°N to 5°S, 150 to 90°W)
    group: sst
    quantity: anomaly
    cadence: monthly
    source: {type: noaa_sst, column: ANOM3}
  - key: nino34
    label: NINO3.4 anomaly
    long_label: NINO3.4 SST anomaly (5°N to 5°S, 170 to 120°W)
    group: sst
    quantity: anomaly
    cadence: monthly
    source: {type: noaa_sst, column: ANOM34}
  - key: nino4
    label: NINO4 anomaly
    long_label: NINO4 SST anomaly (5°N to 5°S, 160°E to 150°W)
    group: sst
    quantity: anomaly
    cadence: monthly
    source: {type: noaa_sst, column: ANOM4}
  - key: callao
    label: Callao
    long_label: Callao, Peru (12.1°S, 77.2°W), UHSLC station 093
    group: sea_level
    quantity: record_mean
    cadence: monthly
    source:
      type: uhslc
      station: "093"
      start_date: "1905-01-01"
      rqd_url: "https://uhslc.soest.hawaii.edu/data/csv/rqds/pacific/hourly/h093a.csv"
  - key: la_libertad
    label: La Libertad
    long_label: La Libertad, Ecuador (2.2°S, 80.9°W), UHSLC station 091
    group: sea_level
    quantity: record_mean
    cadence: monthly
    source:
      type: uhslc
      station: "091"
      start_date: "1949-01-01"
      rqd_url: "https://uhslc.soest.hawaii.edu/data/csv/rqds/pacific/hourly/h091a.csv"
  - key: honolulu
    label: Honolulu
    long_label: Honolulu, Hawaii (21.3°N, 157.9°W), UHSLC station 057
    group: sea_level
    quantity: record_mean
    cadence: monthly
    source:
      type: uhslc
      station: "057"
      start_date: "1905-01-01"
      rqd_url: "https://uhslc.soest.hawaii.edu/data/csv/rqds/pacific/hourly/h057a.csv"
  - key: palau
    label: Palau
    long_label: Malakal, Palau (7.3°N, 134.5°E), UHSLC station 007
    group: sea_level
    quantity: record_mean
    cadence: monthly
    source:
      type: uhslc
      station: "007"
      start_date: "1905-01-01"
      rqd_url: "https://uhslc.soest.hawaii.edu/data/csv/rqds/pacific/hourly/h007a.csv"

# El Niño events offered as highlight buttons (inclusive months).
events:
  - {label: "1982-83", start: "1982-04", end: "1983-09"}
  - {label: "1997-98", start: "1997-03", end: "1998-08"}
  - {label: "2015-16", start: "2015-03", end: "2016-06"}
  - {label: "2023-24", start: "2023-03", end: "2024-05"}
  - {label: "2025-26", start: "2025-02", end: null}   # null end: still running, up to the latest month

# The running event is highlighted when the page opens if the latest observed
# anomaly of `dataset` (vs the window climatology for that calendar month) is
# at least `threshold`, in that dataset's unit. Why 1.0 °C: see METHODS.md.
current_event:
  label: "2025-26"
  dataset: nino12
  threshold: 1.0

site:
  title: El Niño phase space
  repo_url: https://github.com/uferreira/el_nino_202610
  base_url: https://uferreira.github.io/el_nino_202610/

# Duffing model runs, precomputed in Python (python -m enso.model) and cached
# in data/model/. Equation (ported from el_nino/src/el_nino/duffing.py):
#   X'' = K1 X + K3 X^3 + FA cos(W t - FF) + B X'
models:
  duffing:
    transient_cycles: 100     # forcing cycles discarded before anything is kept
    section_cycles: 1500      # one long trajectory: one dot per forcing cycle
    trajectory_cycles: 60     # the stretch drawn as a loop (and used on Compare)
    samples_per_cycle: 12     # time-series samples per forcing cycle
    ndots: 5                  # loop points per sample
    phases: 12                # section phases offered (every 30 degrees)
    fa_factors: [0.5, 0.75, 1.0, 1.25, 1.5]   # forcing amplitude steps, times the preset value
    presets:
      alado:
        label: El Niño fit (ALADO)
        note: >-
          Coefficients of the original Java applet (DoubleWell.21.5), fitted to
          the NINO1+2 attractor; time in months, one forcing cycle per year.
        K1: 0.121847
        K3: -0.03046
        FA: 0.4873
        FF: -60.0
        B: -0.35465
        W: 0.523599          # 2 pi / 12 rad per month, as in the applet
        x0: 0.0
        y0: 0.0
        time_unit: month
      chaos:
        label: Chaotic benchmark
        note: >-
          The classic strange-attractor regime x″ + 0.02x′ − x + x³ = 3 sin t
          (light damping, strong double well, hard forcing). Time is dimensionless.
        # The motion is fast within each cycle: sample it finely, over fewer cycles.
        samples_per_cycle: 36
        trajectory_cycles: 30
        K1: 1.0
        K3: -1.0
        FA: 3.0
        FF: 90.0
        B: -0.02
        W: 1.0
        x0: 1.0
        y0: 0.0
        time_unit: ""
    compare_preset: alado     # the model offered on the Compare page (factor 1.0)
