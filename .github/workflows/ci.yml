name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test tools
        run: |
          pip install -e ".[test]" -c constraints.txt
          python -m playwright install --with-deps chromium

      - name: Tests (analysis, build output, browser)
        run: python -m pytest -q

      # docs/ is the published site. It must be what the committed data and
      # code produce, so nobody edits it by hand or forgets a build. JSON is
      # compared by value (within one step of its 4th decimal): float noise
      # between CPUs must not fail it. Only on the pinned versions (3.12).
      - name: docs/ matches a fresh build
        if: matrix.python-version == '3.12'
        run: python -m enso.build --check
